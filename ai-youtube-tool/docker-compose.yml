
services:
  postgres:
    image: postgres:16-alpine
    container_name: aitube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aitube
      POSTGRES_PASSWORD: aitube_secret
      POSTGRES_DB: aitube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitube"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aitube_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitube_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker-internal hostnames — MUST override .env localhost values
      DATABASE_URL: postgresql+asyncpg://aitube:aitube_secret@postgres:5432/aitube
      REDIS_URL: redis://redis:6379/0
      STORAGE_BASE_PATH: /app/storage
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitube_worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker-internal hostnames — MUST override .env localhost values
      DATABASE_URL: postgresql+asyncpg://aitube:aitube_secret@postgres:5432/aitube
      REDIS_URL: redis://redis:6379/0
      STORAGE_BASE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: aitube_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
